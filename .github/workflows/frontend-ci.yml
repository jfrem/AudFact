name: Frontend CI - AudFact

on:
  push:
    branches: [main, develop, "feature/*", "Dev", "staging"]
  pull_request:
    branches: [main, develop, "staging"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Verify frontend bundle does not embed local API URL
        working-directory: frontend
        run: |
          set -euo pipefail
          if grep -R -E "localhost:8080|127\\.0\\.0\\.1:8080" .next/static 2>/dev/null; then
            echo "::error::Frontend bundle must not embed local backend URLs"
            exit 1
          fi
