name: Deploy Production - AudFact

on:
  workflow_run:
    workflows: ["Publish Images - AudFact"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy. Use a commit SHA for rollback."
        required: true
        default: "latest"

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production-main
  cancel-in-progress: false

env:
  DEPLOY_DIR: ${{ vars.AUDFACT_DEPLOY_DIR }}
  PHP_IMAGE: ghcr.io/${{ github.repository_owner }}/audfact-php
  NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/audfact-nginx
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/audfact-frontend
  FRONTEND_HOST_PORT: ${{ vars.AUDFACT_FRONTEND_HOST_PORT }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_tag }}

jobs:
  deploy:
    name: Deploy to LAN runner
    runs-on: [self-hosted, audfact-prod-lan]
    timeout-minutes: 30
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: false

      - name: Validate required secrets
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB2_HOST: ${{ secrets.DB2_HOST }}
          DB2_PORT: ${{ secrets.DB2_PORT }}
          DB2_NAME: ${{ secrets.DB2_NAME }}
          DB2_USER: ${{ secrets.DB2_USER }}
          DB2_PASS: ${{ secrets.DB2_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          MCP_WEBHOOK_SECRET: ${{ secrets.MCP_WEBHOOK_SECRET }}
          AUDFACT_API_PUBLIC_URL: ${{ vars.AUDFACT_API_PUBLIC_URL }}
        run: |
          set -euo pipefail
          required=(APP_ENV DB_HOST DB_PORT DB_NAME DB_USER DB_PASS DB2_HOST DB2_PORT DB2_NAME DB2_USER DB2_PASS GEMINI_API_KEY MCP_WEBHOOK_SECRET)
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub secret: $key"
              exit 1
            fi
          done

      - name: Prepare deployment directory
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_DIR:-$HOME/audfact-prod}"
          mkdir -p "$DEPLOY_PATH/logs"
          cp docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"

      - name: Create production environment file
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_ENCRYPT: ${{ secrets.DB_ENCRYPT }}
          DB_TRUST_SERVER_CERT: ${{ secrets.DB_TRUST_SERVER_CERT }}
          DB2_HOST: ${{ secrets.DB2_HOST }}
          DB2_PORT: ${{ secrets.DB2_PORT }}
          DB2_NAME: ${{ secrets.DB2_NAME }}
          DB2_USER: ${{ secrets.DB2_USER }}
          DB2_PASS: ${{ secrets.DB2_PASS }}
          DB2_ENCRYPT: ${{ secrets.DB2_ENCRYPT }}
          DB2_TRUST_SERVER_CERT: ${{ secrets.DB2_TRUST_SERVER_CERT }}
          GOOGLE_DRIVE_CLIENT_EMAIL: ${{ secrets.GOOGLE_DRIVE_CLIENT_EMAIL }}
          GOOGLE_DRIVE_PRIVATE_KEY: ${{ secrets.GOOGLE_DRIVE_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          MCP_WEBHOOK_SECRET: ${{ secrets.MCP_WEBHOOK_SECRET }}
          AUDFACT_API_PUBLIC_URL: ${{ vars.AUDFACT_API_PUBLIC_URL }}
          AUDFACT_FRONTEND_HOST_PORT: ${{ vars.AUDFACT_FRONTEND_HOST_PORT }}
          AUDFACT_FRONTEND_PUBLIC_URL: ${{ vars.AUDFACT_FRONTEND_PUBLIC_URL }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          AUDIT_NGINX_READ_TIMEOUT: ${{ secrets.AUDIT_NGINX_READ_TIMEOUT }}
          AUDIT_FPM_TERMINATE_TIMEOUT: ${{ secrets.AUDIT_FPM_TERMINATE_TIMEOUT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          # Force production environment for the production deployment workflow
          APP_ENV="production"

          if [ "${DB_ENCRYPT:-no}" != "no" ] || [ "${DB_TRUST_SERVER_CERT:-yes}" != "yes" ]; then
            echo "::error::Production deploy currently requires DB_ENCRYPT=no and DB_TRUST_SERVER_CERT=yes until SQL Server TLS is remediated"
            exit 1
          fi

          if [ "${DB2_ENCRYPT:-no}" != "no" ] || [ "${DB2_TRUST_SERVER_CERT:-yes}" != "yes" ]; then
            echo "::error::Production deploy currently requires DB2_ENCRYPT=no and DB2_TRUST_SERVER_CERT=yes until SQL Server TLS is remediated"
            exit 1
          fi

          normalize_sql_host() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::error::$name is required" >&2
              exit 1
            fi

            # DB_PORT/DB2_PORT are managed separately by the application DSN builder.
            # If an instance name is supplied (host\instance), deploy with the base host.
            value="${value%%\\*}"

            if [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+[[:alpha:]_].* ]]; then
              echo "::error::$name appears malformed. Use an IP/hostname without a SQL Server instance suffix when DB_PORT is set." >&2
              exit 1
            fi

            if [[ "$value" == *","* ]] || [[ "$value" == *":"* ]] || [[ "$value" =~ [[:space:]] ]]; then
              local port_name="${name/_HOST/_PORT}"
              echo "::error::$name must be a host only; configure the port with $port_name" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          EFFECTIVE_DB_HOST="$(normalize_sql_host DB_HOST "$DB_HOST")"
          EFFECTIVE_DB2_HOST="$(normalize_sql_host DB2_HOST "$DB2_HOST")"

          FRONTEND_HOST_PORT="${AUDFACT_FRONTEND_HOST_PORT:-3100}"
          FRONTEND_PUBLIC_URL="${AUDFACT_FRONTEND_PUBLIC_URL:-http://172.16.0.3:${FRONTEND_HOST_PORT}}"
          API_PUBLIC_URL="${AUDFACT_API_PUBLIC_URL:-http://172.16.0.3:8080}"
          if [ -n "${ALLOWED_ORIGINS}" ]; then
            case ",${ALLOWED_ORIGINS}," in
              *",${FRONTEND_PUBLIC_URL},"*) EFFECTIVE_ALLOWED_ORIGINS="${ALLOWED_ORIGINS}" ;;
              *) EFFECTIVE_ALLOWED_ORIGINS="${ALLOWED_ORIGINS},${FRONTEND_PUBLIC_URL}" ;;
            esac
          else
            EFFECTIVE_ALLOWED_ORIGINS="${FRONTEND_PUBLIC_URL}"
          fi

          {
            printf 'AUDFACT_PHP_IMAGE=%s\n' "$PHP_IMAGE"
            printf 'AUDFACT_NGINX_IMAGE=%s\n' "$NGINX_IMAGE"
            printf 'AUDFACT_FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE"
            printf 'AUDFACT_IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'AUDFACT_FRONTEND_HOST_PORT=%s\n' "$FRONTEND_HOST_PORT"
            printf '\n'
            printf 'APP_ENV=%s\n' "$APP_ENV"
            printf 'AUDFACT_API_PUBLIC_URL=%s\n' "$API_PUBLIC_URL"
            printf 'WRAP_API_BASE=http://nginx\n'
            printf 'WEBHOOK_URL=%s/app/wrap/webhook.php\n' "$API_PUBLIC_URL"
            printf 'CAPABILITIES_URL=%s/app/wrap/capabilities.php\n' "$API_PUBLIC_URL"
            printf 'MCP_WEBHOOK_SECRET=%s\n' "$MCP_WEBHOOK_SECRET"
            printf '\n'
            printf 'DB_TYPE=sqlsrv\n'
            printf 'DB_HOST=%s\n' "$EFFECTIVE_DB_HOST"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_NAME=%s\n' "$DB_NAME"
            printf 'DB_USER=%s\n' "$DB_USER"
            printf 'DB_PASS=%s\n' "$DB_PASS"
            printf '\n'
            printf 'DB2_HOST=%s\n' "$EFFECTIVE_DB2_HOST"
            printf 'DB2_PORT=%s\n' "$DB2_PORT"
            printf 'DB2_NAME=%s\n' "$DB2_NAME"
            printf 'DB2_USER=%s\n' "$DB2_USER"
            printf 'DB2_PASS=%s\n' "$DB2_PASS"
            printf '\n'
            printf 'DB_POOLING=1\n'
            printf 'DB_ENCRYPT=%s\n' "${DB_ENCRYPT:-no}"
            printf 'DB_TRUST_SERVER_CERT=%s\n' "${DB_TRUST_SERVER_CERT:-yes}"
            printf 'DB2_ENCRYPT=%s\n' "${DB2_ENCRYPT:-no}"
            printf 'DB2_TRUST_SERVER_CERT=%s\n' "${DB2_TRUST_SERVER_CERT:-yes}"
            printf '\n'
            printf 'GOOGLE_DRIVE_CLIENT_EMAIL=%s\n' "$GOOGLE_DRIVE_CLIENT_EMAIL"
            printf 'GOOGLE_DRIVE_PRIVATE_KEY=%s\n' "$GOOGLE_DRIVE_PRIVATE_KEY"
            printf 'GOOGLE_DRIVE_TLS_VERIFY=1\n'
            printf '\n'
            printf 'REQUEST_TIMEOUT_MS=60000\n'
            printf 'LOG_LEVEL=%s\n' "${LOG_LEVEL:-warning}"
            printf 'LOG_RETENTION_DAYS=7\n'
            printf 'LOG_MAX_SIZE_MB=10\n'
            printf 'ALLOWED_ORIGINS=%s\n' "$EFFECTIVE_ALLOWED_ORIGINS"
            printf 'MAX_JSON_SIZE=1048576\n'
            printf '\n'
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=gemini-3-flash-preview\n'
            printf 'GEMINI_TEMPERATURE=0.0\n'
            printf 'GEMINI_TIMEOUT=300\n'
            printf 'GEMINI_TOP_P=1.0\n'
            printf 'GEMINI_TOP_K=1\n'
            printf 'GEMINI_MAX_OUTPUT_TOKENS=8192\n'
            printf 'GEMINI_RESPONSE_MIME=application/json\n'
            printf 'GEMINI_MEDIA_RESOLUTION=MEDIA_RESOLUTION_HIGH\n'
            printf 'GEMINI_THINKING_BUDGET=\n'
            printf 'GEMINI_THINKING_LEVEL=\n'
            printf 'GEMINI_EXTRACTION_MAX_OUTPUT_TOKENS=4096\n'
            printf 'GEMINI_EXTRACTION_THINKING_BUDGET=\n'
            printf 'GEMINI_EXTRACTION_THINKING_LEVEL=%s\n' "${GEMINI_EXTRACTION_THINKING_LEVEL:-MINIMAL}"
            printf 'GEMINI_SEMANTIC_MAX_OUTPUT_TOKENS=2048\n'
            printf 'GEMINI_SEMANTIC_THINKING_LEVEL=\n'
            printf 'GEMINI_SEMANTIC_THINKING_BUDGET=\n'
            printf 'GEMINI_SEED=42\n'
            printf '\n'
            printf 'AUDIT_BATCH_MAX_LIMIT=100\n'
            printf 'AUDIT_BATCH_TIMEOUT=3600\n'
            printf 'AUDIT_NGINX_READ_TIMEOUT=%s\n' "${AUDIT_NGINX_READ_TIMEOUT:-3600}"
            printf 'AUDIT_FPM_TERMINATE_TIMEOUT=%s\n' "${AUDIT_FPM_TERMINATE_TIMEOUT:-3600}"
            printf 'AUDIT_CACHE_TTL=86400\n'
            printf 'AUDIT_EXTRACTION_CACHE_TTL=86400\n'
            printf 'AUDIT_STREAM_BLOCK_MS=5000\n'
            printf 'AUDIT_EVENT_MAX_RETRIES=3\n'
            printf 'AUDIT_DLQ_STREAM=audit.dlq\n'
            printf 'AUDIT_INTERNAL_API_BASE=http://nginx\n'
            printf 'AUDIT_VERSION_EXTRACTOR=gemini-3.x-parallel-fc-v1\n'
            printf 'AUDIT_VERSION_NORMALIZER=1.0.0\n'
            printf 'AUDIT_VERSION_RULES=1.0.0\n'
            printf '\n'
            printf 'REDIS_HOST=redis\n'
            printf 'REDIS_PORT=6379\n'
            printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
            printf 'REDIS_PREFIX=audfact:\n'
            printf 'REDIS_MODE=standalone\n'
            printf 'REDIS_PERSISTENT=0\n'
            printf '\n'
            printf 'CB_GEMINI_THRESHOLD=3\n'
            printf 'CB_GEMINI_COOLDOWN=60\n'
          } > "$DEPLOY_PATH/.env"

          chmod 600 "$DEPLOY_PATH/.env"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull release images
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.prod.yml pull

      - name: Preflight SQL connectivity
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"

          docker run --rm -i --env-file .env "${PHP_IMAGE}:${IMAGE_TAG}" php <<'PHP'
          <?php
          $connections = [
              ['default', 'DB_HOST', 'DB_PORT', 'DB_NAME', 'DB_USER', 'DB_PASS', 'DB_ENCRYPT', 'DB_TRUST_SERVER_CERT'],
              ['db2', 'DB2_HOST', 'DB2_PORT', 'DB2_NAME', 'DB2_USER', 'DB2_PASS', 'DB2_ENCRYPT', 'DB2_TRUST_SERVER_CERT'],
          ];

          $failed = false;
          foreach ($connections as $connection) {
              [$label, $hostKey, $portKey, $nameKey, $userKey, $passKey, $encryptKey, $trustKey] = $connection;

              $host = getenv($hostKey) ?: '';
              $port = getenv($portKey) ?: '1433';
              $database = getenv($nameKey) ?: '';
              $user = getenv($userKey) ?: '';
              $password = getenv($passKey) ?: '';
              $encrypt = getenv($encryptKey) ?: 'no';
              $trust = getenv($trustKey) ?: 'yes';

              $dsn = sprintf(
                  'sqlsrv:Server=%s,%s;Database=%s;Encrypt=%s;TrustServerCertificate=%s;ConnectionPooling=0;LoginTimeout=5',
                  $host,
                  $port,
                  $database,
                  $encrypt,
                  $trust
              );

              $start = microtime(true);
              try {
                  $pdo = new PDO($dsn, $user, $password, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
                  $pdo->query('SELECT 1')->fetchColumn();
                  $elapsedMs = (int) round((microtime(true) - $start) * 1000);
                  echo "SQL preflight {$label} OK ({$host}:{$port}, {$elapsedMs}ms)" . PHP_EOL;
              } catch (Throwable $e) {
                  $failed = true;
                  $elapsedMs = (int) round((microtime(true) - $start) * 1000);
                  echo "::error::SQL preflight {$label} failed ({$host}:{$port}, {$elapsedMs}ms): " . $e->getCode() . PHP_EOL;
              }
          }

          exit($failed ? 1 : 0);
          PHP

      - name: Start production stack
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Health check
        run: |
          set -euo pipefail
          sleep 30
          cd "$DEPLOY_PATH"
          if docker exec audfact-frontend sh -lc "grep -R -E 'localhost:8080|127\\.0\\.0\\.1:8080' .next/static 2>/dev/null"; then
            echo "::error::Frontend bundle contains a local backend URL"
            exit 1
          fi

          for i in 1 2 3 4 5; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1 && curl -sf "http://localhost:${FRONTEND_HOST_PORT:-3100}/api/health" > /dev/null 2>&1 && curl -sf "http://localhost:${FRONTEND_HOST_PORT:-3100}/api/backend/health" > /dev/null 2>&1 && curl -sf "http://localhost:${FRONTEND_HOST_PORT:-3100}/clients" > /dev/null 2>&1; then
              echo "Deploy successful. API and frontend health checks passed."
              exit 0
            fi
            echo "Attempt $i/5 failed, waiting 10s..."
            sleep 10
          done

          cd "$DEPLOY_PATH"
          echo "::error::Health check failed"
          docker ps --format "table {{.Names}}\t{{.Status}}"
          docker compose -f docker-compose.prod.yml logs --tail=120 frontend php nginx worker-orchestrator worker-extraction worker-normalizer worker-policy worker-aggregator
          exit 1
