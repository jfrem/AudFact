name: Deploy Production - AudFact

on:
  workflow_run:
    workflows: ["Publish Images - AudFact"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy. Use a commit SHA for rollback."
        required: true
        default: "latest"

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production-main
  cancel-in-progress: false

env:
  DEPLOY_DIR: ${{ vars.AUDFACT_DEPLOY_DIR }}
  PHP_IMAGE: ${{ vars.AUDFACT_PHP_IMAGE || format('ghcr.io/{0}/audfact-php', github.repository_owner) }}
  NGINX_IMAGE: ${{ vars.AUDFACT_NGINX_IMAGE || format('ghcr.io/{0}/audfact-nginx', github.repository_owner) }}
  FRONTEND_IMAGE: ${{ vars.AUDFACT_FRONTEND_IMAGE || format('ghcr.io/{0}/audfact-frontend', github.repository_owner) }}
  FRONTEND_HOST_PORT: ${{ vars.AUDFACT_FRONTEND_HOST_PORT || '3100' }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_tag }}

jobs:
  deploy:
    name: Deploy to LAN runner
    runs-on: [self-hosted, audfact-prod-lan]
    timeout-minutes: 30
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: false

      - name: Validate required secrets
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB2_HOST: ${{ vars.DB2_HOST }}
          DB2_PORT: ${{ vars.DB2_PORT }}
          DB2_NAME: ${{ vars.DB2_NAME }}
          DB2_USER: ${{ secrets.DB2_USER }}
          DB2_PASS: ${{ secrets.DB2_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MCP_WEBHOOK_SECRET: ${{ secrets.MCP_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          required_secrets=(DB_USER DB_PASS DB2_USER DB2_PASS GEMINI_API_KEY MCP_WEBHOOK_SECRET)
          required_variables=(DB_HOST DB_PORT DB_NAME DB2_HOST DB2_PORT DB2_NAME)

          for key in "${required_secrets[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub secret: $key"
              exit 1
            fi
          done

          for key in "${required_variables[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub environment variable: $key"
              exit 1
            fi
          done

      - name: Prepare deployment directory
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_DIR:-$HOME/audfact-prod}"
          mkdir -p "$DEPLOY_PATH/logs"
          cp docker-compose.yml "$DEPLOY_PATH/docker-compose.yml"
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"

      - name: Create production environment file
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          WRAP_API_BASE: ${{ vars.WRAP_API_BASE }}
          WWWUSER_ID: ${{ vars.WWWUSER_ID }}
          WWWGROUP_ID: ${{ vars.WWWGROUP_ID }}
          AUDFACT_API_PUBLIC_URL: ${{ vars.AUDFACT_API_PUBLIC_URL }}
          INTERNAL_API_URL: ${{ vars.INTERNAL_API_URL }}
          AUDFACT_FRONTEND_PUBLIC_URL: ${{ vars.AUDFACT_FRONTEND_PUBLIC_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_DEFAULT_THEME: ${{ vars.NEXT_PUBLIC_DEFAULT_THEME }}
          NEXT_PUBLIC_POLLING_JOBS_MS: ${{ vars.NEXT_PUBLIC_POLLING_JOBS_MS }}
          NEXT_PUBLIC_POLLING_HEALTH_MS: ${{ vars.NEXT_PUBLIC_POLLING_HEALTH_MS }}
          NEXT_PUBLIC_LOCALE: ${{ vars.NEXT_PUBLIC_LOCALE }}
          NEXT_PUBLIC_TIMEZONE: ${{ vars.NEXT_PUBLIC_TIMEZONE }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          CAPABILITIES_URL: ${{ vars.CAPABILITIES_URL }}
          DB_TYPE: ${{ vars.DB_TYPE }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB2_HOST: ${{ vars.DB2_HOST }}
          DB2_PORT: ${{ vars.DB2_PORT }}
          DB2_NAME: ${{ vars.DB2_NAME }}
          DB2_USER: ${{ secrets.DB2_USER }}
          DB2_PASS: ${{ secrets.DB2_PASS }}
          DB_POOLING: ${{ vars.DB_POOLING }}
          DB2_POOLING: ${{ vars.DB2_POOLING }}
          DB_ENCRYPT: ${{ vars.DB_ENCRYPT }}
          DB_TRUST_SERVER_CERT: ${{ vars.DB_TRUST_SERVER_CERT }}
          DB2_ENCRYPT: ${{ vars.DB2_ENCRYPT }}
          DB2_TRUST_SERVER_CERT: ${{ vars.DB2_TRUST_SERVER_CERT }}
          GOOGLE_DRIVE_CLIENT_EMAIL: ${{ vars.GOOGLE_DRIVE_CLIENT_EMAIL }}
          GOOGLE_DRIVE_PRIVATE_KEY: ${{ secrets.GOOGLE_DRIVE_PRIVATE_KEY }}
          GOOGLE_DRIVE_TLS_VERIFY: ${{ vars.GOOGLE_DRIVE_TLS_VERIFY }}
          REQUEST_TIMEOUT_MS: ${{ vars.REQUEST_TIMEOUT_MS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          LOG_RETENTION_DAYS: ${{ vars.LOG_RETENTION_DAYS }}
          LOG_MAX_SIZE_MB: ${{ vars.LOG_MAX_SIZE_MB }}
          AUDIT_RESPONSE_IA_ENABLED: ${{ vars.AUDIT_RESPONSE_IA_ENABLED }}
          AUDIT_RESPONSE_IA_DIR: ${{ vars.AUDIT_RESPONSE_IA_DIR }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          MAX_JSON_SIZE: ${{ vars.MAX_JSON_SIZE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_TEMPERATURE: ${{ vars.GEMINI_TEMPERATURE }}
          GEMINI_TIMEOUT: ${{ vars.GEMINI_TIMEOUT }}
          GEMINI_TOP_P: ${{ vars.GEMINI_TOP_P }}
          GEMINI_TOP_K: ${{ vars.GEMINI_TOP_K }}
          GEMINI_MAX_OUTPUT_TOKENS: ${{ vars.GEMINI_MAX_OUTPUT_TOKENS }}
          GEMINI_MEDIA_RESOLUTION: ${{ vars.GEMINI_MEDIA_RESOLUTION }}
          GEMINI_THINKING_BUDGET: ${{ vars.GEMINI_THINKING_BUDGET }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
          GEMINI_EXTRACTION_MAX_OUTPUT_TOKENS: ${{ vars.GEMINI_EXTRACTION_MAX_OUTPUT_TOKENS }}
          GEMINI_EXTRACTION_THINKING_BUDGET: ${{ vars.GEMINI_EXTRACTION_THINKING_BUDGET }}
          GEMINI_EXTRACTION_THINKING_LEVEL: ${{ vars.GEMINI_EXTRACTION_THINKING_LEVEL }}
          GEMINI_SEMANTIC_MAX_OUTPUT_TOKENS: ${{ vars.GEMINI_SEMANTIC_MAX_OUTPUT_TOKENS }}
          GEMINI_SEMANTIC_THINKING_LEVEL: ${{ vars.GEMINI_SEMANTIC_THINKING_LEVEL }}
          GEMINI_SEMANTIC_THINKING_BUDGET: ${{ vars.GEMINI_SEMANTIC_THINKING_BUDGET }}
          GEMINI_SEED: ${{ vars.GEMINI_SEED }}
          AUDIT_BATCH_MAX_LIMIT: ${{ vars.AUDIT_BATCH_MAX_LIMIT }}
          AUDIT_BATCH_TIMEOUT: ${{ vars.AUDIT_BATCH_TIMEOUT }}
          AUDIT_NGINX_READ_TIMEOUT: ${{ vars.AUDIT_NGINX_READ_TIMEOUT }}
          AUDIT_FPM_TERMINATE_TIMEOUT: ${{ vars.AUDIT_FPM_TERMINATE_TIMEOUT }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_PREFIX: ${{ vars.REDIS_PREFIX }}
          REDIS_MAXMEMORY: ${{ vars.REDIS_MAXMEMORY }}
          REDIS_MAXMEMORY_POLICY: ${{ vars.REDIS_MAXMEMORY_POLICY }}
          REDIS_CONTAINER_MEMORY: ${{ vars.REDIS_CONTAINER_MEMORY }}
          REDIS_MODE: ${{ vars.REDIS_MODE }}
          REDIS_PERSISTENT: ${{ vars.REDIS_PERSISTENT }}
          CB_GEMINI_THRESHOLD: ${{ vars.CB_GEMINI_THRESHOLD }}
          CB_GEMINI_COOLDOWN: ${{ vars.CB_GEMINI_COOLDOWN }}
          AUDIT_INTERNAL_API_BASE: ${{ vars.AUDIT_INTERNAL_API_BASE }}
          AUDIT_WORKER_ORCHESTRATOR_REPLICAS: ${{ vars.AUDIT_WORKER_ORCHESTRATOR_REPLICAS }}
          AUDIT_WORKER_DOWNLOADER_REPLICAS: ${{ vars.AUDIT_WORKER_DOWNLOADER_REPLICAS }}
          AUDIT_WORKER_EXTRACTION_REPLICAS: ${{ vars.AUDIT_WORKER_EXTRACTION_REPLICAS }}
          AUDIT_WORKER_POLICY_REPLICAS: ${{ vars.AUDIT_WORKER_POLICY_REPLICAS }}
          AUDIT_WORKER_PERSISTENCE_REPLICAS: ${{ vars.AUDIT_WORKER_PERSISTENCE_REPLICAS }}
          AUDIT_WORKER_BATCH_REPLICAS: ${{ vars.AUDIT_WORKER_BATCH_REPLICAS }}
          AUDIT_IDEMPOTENCY_KEY_TTL: ${{ vars.AUDIT_IDEMPOTENCY_KEY_TTL }}
          AUDIT_JOB_TTL: ${{ vars.AUDIT_JOB_TTL }}
          AUDIT_STATE_TTL: ${{ vars.AUDIT_STATE_TTL }}
          AUDIT_PERSISTENCE_QUEUE_TTL: ${{ vars.AUDIT_PERSISTENCE_QUEUE_TTL }}
          AUDIT_RESERVATION_TTL: ${{ vars.AUDIT_RESERVATION_TTL }}
          AUDIT_PENDING_RECLAIM_IDLE_MS: ${{ vars.AUDIT_PENDING_RECLAIM_IDLE_MS }}
          AUDIT_PENDING_RECLAIM_INTERVAL_MS: ${{ vars.AUDIT_PENDING_RECLAIM_INTERVAL_MS }}
          AUDIT_EVENT_MAX_RETRIES: ${{ vars.AUDIT_EVENT_MAX_RETRIES }}
          AUDIT_STREAM_BLOCK_MS: ${{ vars.AUDIT_STREAM_BLOCK_MS }}
          AUDIT_DLQ_STREAM: ${{ vars.AUDIT_DLQ_STREAM }}
          AUDIT_CACHE_TTL: ${{ vars.AUDIT_CACHE_TTL }}
          AUDIT_EXTRACTION_CACHE_TTL: ${{ vars.AUDIT_EXTRACTION_CACHE_TTL }}
          AUDIT_VERSION_EXTRACTOR: ${{ vars.AUDIT_VERSION_EXTRACTOR }}
          AUDIT_VERSION_NORMALIZER: ${{ vars.AUDIT_VERSION_NORMALIZER }}
          AUDIT_VERSION_RULES: ${{ vars.AUDIT_VERSION_RULES }}
          MCP_WEBHOOK_SECRET: ${{ secrets.MCP_WEBHOOK_SECRET }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          APP_ENV="production"
          EFFECTIVE_WRAP_API_BASE="${WRAP_API_BASE:-http://nginx}"
          EFFECTIVE_INTERNAL_API_URL="${INTERNAL_API_URL:-http://nginx}"

          if [ "${DB_ENCRYPT:-no}" != "no" ] || [ "${DB_TRUST_SERVER_CERT:-yes}" != "yes" ]; then
            echo "::error::Production deploy currently requires DB_ENCRYPT=no and DB_TRUST_SERVER_CERT=yes until SQL Server TLS is remediated"
            exit 1
          fi

          if [ "${DB2_ENCRYPT:-no}" != "no" ] || [ "${DB2_TRUST_SERVER_CERT:-yes}" != "yes" ]; then
            echo "::error::Production deploy currently requires DB2_ENCRYPT=no and DB2_TRUST_SERVER_CERT=yes until SQL Server TLS is remediated"
            exit 1
          fi

          normalize_sql_host() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::error::$name is required" >&2
              exit 1
            fi

            # DB_PORT/DB2_PORT are managed separately by the application DSN builder.
            # If an instance name is supplied (host\instance), deploy with the base host.
            value="${value%%\\*}"

            if [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+[[:alpha:]_].* ]]; then
              echo "::error::$name appears malformed. Use an IP/hostname without a SQL Server instance suffix when DB_PORT is set." >&2
              exit 1
            fi

            if [[ "$value" == *","* ]] || [[ "$value" == *":"* ]] || [[ "$value" =~ [[:space:]] ]]; then
              local port_name="${name/_HOST/_PORT}"
              echo "::error::$name must be a host only; configure the port with $port_name" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          EFFECTIVE_DB_HOST="$(normalize_sql_host DB_HOST "$DB_HOST")"
          EFFECTIVE_DB2_HOST="$(normalize_sql_host DB2_HOST "$DB2_HOST")"

          FRONTEND_HOST_PORT="${AUDFACT_FRONTEND_HOST_PORT:-3100}"
          FRONTEND_PUBLIC_URL="${AUDFACT_FRONTEND_PUBLIC_URL:-http://172.16.0.3:${FRONTEND_HOST_PORT}}"
          API_PUBLIC_URL="${AUDFACT_API_PUBLIC_URL:-http://172.16.0.3:8080}"
          WEBHOOK_URL="${WEBHOOK_URL:-${API_PUBLIC_URL}/app/wrap/webhook.php}"
          CAPABILITIES_URL="${CAPABILITIES_URL:-${API_PUBLIC_URL}/app/wrap/capabilities.php}"

          if [ -n "${ALLOWED_ORIGINS}" ]; then
            case ",${ALLOWED_ORIGINS}," in
              *",${FRONTEND_PUBLIC_URL},"*) EFFECTIVE_ALLOWED_ORIGINS="${ALLOWED_ORIGINS}" ;;
              *) EFFECTIVE_ALLOWED_ORIGINS="${ALLOWED_ORIGINS},${FRONTEND_PUBLIC_URL}" ;;
            esac
          else
            EFFECTIVE_ALLOWED_ORIGINS="${FRONTEND_PUBLIC_URL}"
          fi

          escape_env_value() {
            local value="${1-}"
            value="${value//$'\r'/}"
            value="${value//$'\n'/\\n}"
            printf '%s' "$value"
          }

          write_env_var() {
            local key="$1"
            local value="${2-}"
            printf '%s=%s\n' "$key" "$(escape_env_value "$value")"
          }

          {
            write_env_var 'APP_ENV' "$APP_ENV"
            write_env_var 'WRAP_API_BASE' "$EFFECTIVE_WRAP_API_BASE"
            write_env_var 'WWWUSER_ID' "${WWWUSER_ID:-1000}"
            write_env_var 'WWWGROUP_ID' "${WWWGROUP_ID:-1000}"
            write_env_var 'AUDFACT_API_PUBLIC_URL' "$API_PUBLIC_URL"
            write_env_var 'INTERNAL_API_URL' "$EFFECTIVE_INTERNAL_API_URL"
            write_env_var 'AUDFACT_FRONTEND_PUBLIC_URL' "$FRONTEND_PUBLIC_URL"
            printf '\n'
            write_env_var 'AUDFACT_PHP_IMAGE' "$PHP_IMAGE"
            write_env_var 'AUDFACT_NGINX_IMAGE' "$NGINX_IMAGE"
            write_env_var 'AUDFACT_FRONTEND_IMAGE' "$FRONTEND_IMAGE"
            write_env_var 'AUDFACT_IMAGE_TAG' "$IMAGE_TAG"
            write_env_var 'AUDFACT_FRONTEND_HOST_PORT' "$FRONTEND_HOST_PORT"
            printf '\n'
            write_env_var 'NEXT_PUBLIC_APP_NAME' "${NEXT_PUBLIC_APP_NAME:-AudFact}"
            write_env_var 'NEXT_PUBLIC_DEFAULT_THEME' "${NEXT_PUBLIC_DEFAULT_THEME:-dark}"
            write_env_var 'NEXT_PUBLIC_POLLING_JOBS_MS' "${NEXT_PUBLIC_POLLING_JOBS_MS:-5000}"
            write_env_var 'NEXT_PUBLIC_POLLING_HEALTH_MS' "${NEXT_PUBLIC_POLLING_HEALTH_MS:-30000}"
            write_env_var 'NEXT_PUBLIC_LOCALE' "${NEXT_PUBLIC_LOCALE:-es-CO}"
            write_env_var 'NEXT_PUBLIC_TIMEZONE' "${NEXT_PUBLIC_TIMEZONE:-America/Bogota}"
            printf '\n'
            write_env_var 'WEBHOOK_URL' "$WEBHOOK_URL"
            write_env_var 'CAPABILITIES_URL' "$CAPABILITIES_URL"
            write_env_var 'MCP_WEBHOOK_SECRET' "$MCP_WEBHOOK_SECRET"
            printf '\n'
            write_env_var 'DB_TYPE' "${DB_TYPE:-sqlsrv}"
            write_env_var 'DB_HOST' "$EFFECTIVE_DB_HOST"
            write_env_var 'DB_PORT' "$DB_PORT"
            write_env_var 'DB_NAME' "$DB_NAME"
            write_env_var 'DB_USER' "$DB_USER"
            write_env_var 'DB_PASS' "$DB_PASS"
            printf '\n'
            write_env_var 'DB2_HOST' "$EFFECTIVE_DB2_HOST"
            write_env_var 'DB2_PORT' "$DB2_PORT"
            write_env_var 'DB2_NAME' "$DB2_NAME"
            write_env_var 'DB2_USER' "$DB2_USER"
            write_env_var 'DB2_PASS' "$DB2_PASS"
            printf '\n'
            write_env_var 'DB_POOLING' "${DB_POOLING:-1}"
            write_env_var 'DB2_POOLING' "${DB2_POOLING:-1}"
            write_env_var 'DB_ENCRYPT' "${DB_ENCRYPT:-no}"
            write_env_var 'DB_TRUST_SERVER_CERT' "${DB_TRUST_SERVER_CERT:-yes}"
            write_env_var 'DB2_ENCRYPT' "${DB2_ENCRYPT:-no}"
            write_env_var 'DB2_TRUST_SERVER_CERT' "${DB2_TRUST_SERVER_CERT:-yes}"
            printf '\n'
            write_env_var 'GOOGLE_DRIVE_CLIENT_EMAIL' "$GOOGLE_DRIVE_CLIENT_EMAIL"
            write_env_var 'GOOGLE_DRIVE_PRIVATE_KEY' "$GOOGLE_DRIVE_PRIVATE_KEY"
            write_env_var 'GOOGLE_DRIVE_TLS_VERIFY' "${GOOGLE_DRIVE_TLS_VERIFY:-1}"
            printf '\n'
            write_env_var 'REQUEST_TIMEOUT_MS' "${REQUEST_TIMEOUT_MS:-60000}"
            write_env_var 'LOG_LEVEL' "${LOG_LEVEL:-warning}"
            write_env_var 'LOG_RETENTION_DAYS' "${LOG_RETENTION_DAYS:-7}"
            write_env_var 'LOG_MAX_SIZE_MB' "${LOG_MAX_SIZE_MB:-10}"
            write_env_var 'AUDIT_RESPONSE_IA_ENABLED' "${AUDIT_RESPONSE_IA_ENABLED:-0}"
            write_env_var 'AUDIT_RESPONSE_IA_DIR' "${AUDIT_RESPONSE_IA_DIR:-/var/www/html/logs/responseIA}"
            write_env_var 'ALLOWED_ORIGINS' "$EFFECTIVE_ALLOWED_ORIGINS"
            write_env_var 'MAX_JSON_SIZE' "${MAX_JSON_SIZE:-1048576}"
            printf '\n'
            write_env_var 'GEMINI_API_KEY' "$GEMINI_API_KEY"
            write_env_var 'GEMINI_MODEL' "${GEMINI_MODEL:-gemini-3-flash-preview}"
            write_env_var 'GEMINI_TEMPERATURE' "${GEMINI_TEMPERATURE:-0.0}"
            write_env_var 'GEMINI_TIMEOUT' "${GEMINI_TIMEOUT:-300}"
            write_env_var 'GEMINI_TOP_P' "${GEMINI_TOP_P:-1.0}"
            write_env_var 'GEMINI_TOP_K' "${GEMINI_TOP_K:-1}"
            write_env_var 'GEMINI_MAX_OUTPUT_TOKENS' "${GEMINI_MAX_OUTPUT_TOKENS:-8192}"
            write_env_var 'GEMINI_MEDIA_RESOLUTION' "${GEMINI_MEDIA_RESOLUTION:-MEDIA_RESOLUTION_HIGH}"
            write_env_var 'GEMINI_THINKING_BUDGET' "${GEMINI_THINKING_BUDGET:-}"
            write_env_var 'GEMINI_THINKING_LEVEL' "${GEMINI_THINKING_LEVEL:-}"
            write_env_var 'GEMINI_EXTRACTION_MAX_OUTPUT_TOKENS' "${GEMINI_EXTRACTION_MAX_OUTPUT_TOKENS:-4096}"
            write_env_var 'GEMINI_EXTRACTION_THINKING_BUDGET' "${GEMINI_EXTRACTION_THINKING_BUDGET:-}"
            write_env_var 'GEMINI_EXTRACTION_THINKING_LEVEL' "${GEMINI_EXTRACTION_THINKING_LEVEL:-MINIMAL}"
            write_env_var 'GEMINI_SEMANTIC_MAX_OUTPUT_TOKENS' "${GEMINI_SEMANTIC_MAX_OUTPUT_TOKENS:-2048}"
            write_env_var 'GEMINI_SEMANTIC_THINKING_LEVEL' "${GEMINI_SEMANTIC_THINKING_LEVEL:-}"
            write_env_var 'GEMINI_SEMANTIC_THINKING_BUDGET' "${GEMINI_SEMANTIC_THINKING_BUDGET:-}"
            write_env_var 'GEMINI_SEED' "${GEMINI_SEED:-42}"
            printf '\n'
            write_env_var 'AUDIT_BATCH_MAX_LIMIT' "${AUDIT_BATCH_MAX_LIMIT:-100}"
            write_env_var 'AUDIT_BATCH_TIMEOUT' "${AUDIT_BATCH_TIMEOUT:-3600}"
            write_env_var 'AUDIT_NGINX_READ_TIMEOUT' "${AUDIT_NGINX_READ_TIMEOUT:-3600}"
            write_env_var 'AUDIT_FPM_TERMINATE_TIMEOUT' "${AUDIT_FPM_TERMINATE_TIMEOUT:-3600}"
            printf '\n'
            write_env_var 'REDIS_HOST' "${REDIS_HOST:-redis}"
            write_env_var 'REDIS_PORT' "${REDIS_PORT:-6379}"
            write_env_var 'REDIS_PREFIX' "${REDIS_PREFIX:-audfact:}"
            write_env_var 'REDIS_MAXMEMORY' "${REDIS_MAXMEMORY:-4gb}"
            write_env_var 'REDIS_MAXMEMORY_POLICY' "${REDIS_MAXMEMORY_POLICY:-volatile-lru}"
            write_env_var 'REDIS_CONTAINER_MEMORY' "${REDIS_CONTAINER_MEMORY:-5G}"
            write_env_var 'REDIS_PASSWORD' "$REDIS_PASSWORD"
            write_env_var 'REDIS_MODE' "${REDIS_MODE:-standalone}"
            write_env_var 'REDIS_PERSISTENT' "${REDIS_PERSISTENT:-0}"
            printf '\n'
            write_env_var 'CB_GEMINI_THRESHOLD' "${CB_GEMINI_THRESHOLD:-3}"
            write_env_var 'CB_GEMINI_COOLDOWN' "${CB_GEMINI_COOLDOWN:-60}"
            printf '\n'
            write_env_var 'AUDIT_INTERNAL_API_BASE' "${AUDIT_INTERNAL_API_BASE:-http://nginx}"
            write_env_var 'AUDIT_WORKER_ORCHESTRATOR_REPLICAS' "${AUDIT_WORKER_ORCHESTRATOR_REPLICAS:-3}"
            write_env_var 'AUDIT_WORKER_DOWNLOADER_REPLICAS' "${AUDIT_WORKER_DOWNLOADER_REPLICAS:-8}"
            write_env_var 'AUDIT_WORKER_EXTRACTION_REPLICAS' "${AUDIT_WORKER_EXTRACTION_REPLICAS:-8}"
            write_env_var 'AUDIT_WORKER_NORMALIZER_REPLICAS' "${AUDIT_WORKER_NORMALIZER_REPLICAS:-2}"
            write_env_var 'AUDIT_WORKER_POLICY_REPLICAS' "${AUDIT_WORKER_POLICY_REPLICAS:-2}"
            write_env_var 'AUDIT_WORKER_PERSISTENCE_REPLICAS' "${AUDIT_WORKER_PERSISTENCE_REPLICAS:-3}"
            write_env_var 'AUDIT_WORKER_BATCH_REPLICAS' "${AUDIT_WORKER_BATCH_REPLICAS:-2}"
            write_env_var 'AUDIT_IDEMPOTENCY_KEY_TTL' "${AUDIT_IDEMPOTENCY_KEY_TTL:-300}"
            write_env_var 'AUDIT_JOB_TTL' "${AUDIT_JOB_TTL:-604800}"
            write_env_var 'AUDIT_STATE_TTL' "${AUDIT_STATE_TTL:-604800}"
            write_env_var 'AUDIT_PERSISTENCE_QUEUE_TTL' "${AUDIT_PERSISTENCE_QUEUE_TTL:-604800}"
            write_env_var 'AUDIT_RESERVATION_TTL' "${AUDIT_RESERVATION_TTL:-86400}"
            write_env_var 'AUDIT_PENDING_RECLAIM_IDLE_MS' "${AUDIT_PENDING_RECLAIM_IDLE_MS:-600000}"
            write_env_var 'AUDIT_PENDING_RECLAIM_INTERVAL_MS' "${AUDIT_PENDING_RECLAIM_INTERVAL_MS:-30000}"
            write_env_var 'AUDIT_EVENT_MAX_RETRIES' "${AUDIT_EVENT_MAX_RETRIES:-3}"
            write_env_var 'AUDIT_STREAM_BLOCK_MS' "${AUDIT_STREAM_BLOCK_MS:-5000}"
            write_env_var 'AUDIT_DLQ_STREAM' "${AUDIT_DLQ_STREAM:-audit.dlq}"
            printf '\n'
            write_env_var 'AUDIT_CACHE_TTL' "${AUDIT_CACHE_TTL:-86400}"
            write_env_var 'AUDIT_EXTRACTION_CACHE_TTL' "${AUDIT_EXTRACTION_CACHE_TTL:-86400}"
            printf '\n'
            write_env_var 'AUDIT_VERSION_EXTRACTOR' "${AUDIT_VERSION_EXTRACTOR:-gemini-3.x-parallel-fc-v1}"
            write_env_var 'AUDIT_VERSION_NORMALIZER' "${AUDIT_VERSION_NORMALIZER:-1.0.0}"
            write_env_var 'AUDIT_VERSION_RULES' "${AUDIT_VERSION_RULES:-1.0.0}"
          } > "$DEPLOY_PATH/.env"

          chmod 600 "$DEPLOY_PATH/.env"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull release images
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose pull

      - name: Preflight SQL connectivity
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"

          docker run --rm -i --env-file .env "${PHP_IMAGE}:${IMAGE_TAG}" php <<'PHP'
          <?php
          $connections = [
              ['default', 'DB_HOST', 'DB_PORT', 'DB_NAME', 'DB_USER', 'DB_PASS', 'DB_ENCRYPT', 'DB_TRUST_SERVER_CERT'],
              ['db2', 'DB2_HOST', 'DB2_PORT', 'DB2_NAME', 'DB2_USER', 'DB2_PASS', 'DB2_ENCRYPT', 'DB2_TRUST_SERVER_CERT'],
          ];

          $failed = false;
          foreach ($connections as $connection) {
              [$label, $hostKey, $portKey, $nameKey, $userKey, $passKey, $encryptKey, $trustKey] = $connection;

              $host = getenv($hostKey) ?: '';
              $port = getenv($portKey) ?: '1433';
              $database = getenv($nameKey) ?: '';
              $user = getenv($userKey) ?: '';
              $password = getenv($passKey) ?: '';
              $encrypt = getenv($encryptKey) ?: 'no';
              $trust = getenv($trustKey) ?: 'yes';

              $dsn = sprintf(
                  'sqlsrv:Server=%s,%s;Database=%s;Encrypt=%s;TrustServerCertificate=%s;ConnectionPooling=0;LoginTimeout=5',
                  $host,
                  $port,
                  $database,
                  $encrypt,
                  $trust
              );

              $start = microtime(true);
              try {
                  $pdo = new PDO($dsn, $user, $password, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
                  $pdo->query('SELECT 1')->fetchColumn();
                  $elapsedMs = (int) round((microtime(true) - $start) * 1000);
                  echo "SQL preflight {$label} OK ({$host}:{$port}, {$elapsedMs}ms)" . PHP_EOL;
              } catch (Throwable $e) {
                  $failed = true;
                  $elapsedMs = (int) round((microtime(true) - $start) * 1000);
                  echo "::error::SQL preflight {$label} failed ({$host}:{$port}, {$elapsedMs}ms): " . $e->getCode() . PHP_EOL;
              }
          }

          exit($failed ? 1 : 0);
          PHP

      - name: Start production stack
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose --profile frontend up -d --no-build --remove-orphans

      - name: Health check
        run: |
          set -euo pipefail
          sleep 30
          cd "$DEPLOY_PATH"
          if docker exec audfact-frontend sh -lc "grep -R -E 'localhost:8080|127\\.0\\.0\\.1:8080' .next/static 2>/dev/null"; then
            echo "::error::Frontend bundle contains a local backend URL"
            exit 1
          fi

          for i in 1 2 3 4 5; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1 && curl -sf "http://localhost:${FRONTEND_HOST_PORT:-3100}/api/health" > /dev/null 2>&1 && curl -sf "http://localhost:${FRONTEND_HOST_PORT:-3100}/api/backend/health" > /dev/null 2>&1 && curl -sf "http://localhost:${FRONTEND_HOST_PORT:-3100}/clients" > /dev/null 2>&1; then
              echo "Deploy successful. API and frontend health checks passed."
              exit 0
            fi
            echo "Attempt $i/5 failed, waiting 10s..."
            sleep 10
          done

          cd "$DEPLOY_PATH"
          echo "::error::Health check failed"
          docker ps --format "table {{.Names}}\t{{.Status}}"
          docker compose logs --tail=120 frontend php nginx worker-batch worker-orchestrator worker-extraction worker-downloader worker-normalizer worker-policy worker-persistence
          exit 1
