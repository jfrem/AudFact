name: Deploy Production - AudFact

on:
  workflow_run:
    workflows: ["Publish Images - AudFact"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy. Use a commit SHA for rollback."
        required: true
        default: "latest"

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production-main
  cancel-in-progress: false

env:
  DEPLOY_DIR: ${{ vars.AUDFACT_DEPLOY_DIR }}
  PHP_IMAGE: ${{ vars.AUDFACT_PHP_IMAGE || format('ghcr.io/{0}/audfact-php', github.repository_owner) }}
  NGINX_IMAGE: ${{ vars.AUDFACT_NGINX_IMAGE || format('ghcr.io/{0}/audfact-nginx', github.repository_owner) }}
  FRONTEND_IMAGE: ${{ vars.AUDFACT_FRONTEND_IMAGE || format('ghcr.io/{0}/audfact-frontend', github.repository_owner) }}
  DOCS_IMAGE: ${{ vars.AUDFACT_DOCS_IMAGE || format('ghcr.io/{0}/audfact-docs', github.repository_owner) }}
  FRONTEND_HOST_PORT: ${{ vars.AUDFACT_FRONTEND_HOST_PORT || '3100' }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_tag }}

jobs:
  deploy:
    name: Deploy to LAN runner
    runs-on: [self-hosted, audfact-prod-lan]
    timeout-minutes: 30
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: false

      - name: Ensure jq is available
        run: |
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
          jq --version

      - name: Prepare deployment directory
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_DIR:-$HOME/audfact-prod}"
          mkdir -p "$DEPLOY_PATH/logs"
          cp docker-compose.yml "$DEPLOY_PATH/docker-compose.yml"
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"

      - name: Create production environment file
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
          ALL_VARS: ${{ toJson(vars) }}
        run: |
          set -euo pipefail
          umask 077

          # =========================================================
          # ZERO-DRIFT ENV GENERATION
          # Source of truth: .env.example
          # Values: GitHub Environment secrets + vars → fallback to .env.example defaults
          # =========================================================

          escape_env_value() {
            local value="${1-}"
            value="${value//$'\r'/}"
            value="${value//$'\n'/\\n}"
            printf '%s' "$value"
          }

          write_env_var() {
            local key="$1"
            local value="${2-}"
            printf '%s=%s\n' "$key" "$(escape_env_value "$value")"
          }

          # --- Resolve computed values ---
          EFFECTIVE_WRAP_API_BASE="$(echo "$ALL_VARS" | jq -r '.WRAP_API_BASE // "http://nginx"')"
          EFFECTIVE_INTERNAL_API_URL="$(echo "$ALL_VARS" | jq -r '.INTERNAL_API_URL // "http://nginx"')"
          EFFECTIVE_AUDIT_INTERNAL_API_BASE="$(echo "$ALL_VARS" | jq -r '.AUDIT_INTERNAL_API_BASE // "http://nginx"')"

          API_PUBLIC_URL="$(echo "$ALL_VARS" | jq -r '.AUDFACT_API_PUBLIC_URL // "http://172.16.0.3:8080"')"
          FRONTEND_PUBLIC_URL="$(echo "$ALL_VARS" | jq -r '.AUDFACT_FRONTEND_PUBLIC_URL // "http://172.16.0.3:'"${FRONTEND_HOST_PORT}"'"')"

          RAW_WEBHOOK="$(echo "$ALL_VARS" | jq -r '.WEBHOOK_URL // empty')"
          RAW_CAPS="$(echo "$ALL_VARS" | jq -r '.CAPABILITIES_URL // empty')"
          EFFECTIVE_WEBHOOK_URL="${RAW_WEBHOOK:-${API_PUBLIC_URL}/app/wrap/webhook.php}"
          EFFECTIVE_CAPABILITIES_URL="${RAW_CAPS:-${API_PUBLIC_URL}/app/wrap/capabilities.php}"

          # ALLOWED_ORIGINS: merge frontend URL if not already present
          RAW_ORIGINS="$(echo "$ALL_VARS" | jq -r '.ALLOWED_ORIGINS // empty')"
          if [ -n "$RAW_ORIGINS" ]; then
            case ",$RAW_ORIGINS," in
              *",$FRONTEND_PUBLIC_URL,"*) EFFECTIVE_ALLOWED_ORIGINS="$RAW_ORIGINS" ;;
              *) EFFECTIVE_ALLOWED_ORIGINS="${RAW_ORIGINS},${FRONTEND_PUBLIC_URL}" ;;
            esac
          else
            EFFECTIVE_ALLOWED_ORIGINS="$FRONTEND_PUBLIC_URL"
          fi

          # Normalize SQL hosts (strip instance names, validate format)
          normalize_sql_host() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::error::$name is required" >&2
              exit 1
            fi

            value="${value%%\\*}"

            if [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+[[:alpha:]_].* ]]; then
              echo "::error::$name appears malformed. Use an IP/hostname without a SQL Server instance suffix when DB_PORT is set." >&2
              exit 1
            fi

            if [[ "$value" == *","* ]] || [[ "$value" == *":"* ]] || [[ "$value" =~ [[:space:]] ]]; then
              local port_name="${name/_HOST/_PORT}"
              echo "::error::$name must be a host only; configure the port with $port_name" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          RAW_DB_HOST="$(echo "$ALL_VARS" | jq -r '.DB_HOST // empty')"
          RAW_DB2_HOST="$(echo "$ALL_VARS" | jq -r '.DB2_HOST // empty')"
          EFFECTIVE_DB_HOST="$(normalize_sql_host DB_HOST "$RAW_DB_HOST")"
          EFFECTIVE_DB2_HOST="$(normalize_sql_host DB2_HOST "$RAW_DB2_HOST")"

          # TLS enforcement (temporary production constraint)
          DB_ENCRYPT_VAL="$(echo "$ALL_VARS" | jq -r '.DB_ENCRYPT // "no"')"
          DB_TRUST_VAL="$(echo "$ALL_VARS" | jq -r '.DB_TRUST_SERVER_CERT // "yes"')"
          DB2_ENCRYPT_VAL="$(echo "$ALL_VARS" | jq -r '.DB2_ENCRYPT // "no"')"
          DB2_TRUST_VAL="$(echo "$ALL_VARS" | jq -r '.DB2_TRUST_SERVER_CERT // "yes"')"

          if [ "$DB_ENCRYPT_VAL" != "no" ] || [ "$DB_TRUST_VAL" != "yes" ]; then
            echo "::error::Production deploy currently requires DB_ENCRYPT=no and DB_TRUST_SERVER_CERT=yes until SQL Server TLS is remediated"
            exit 1
          fi
          if [ "$DB2_ENCRYPT_VAL" != "no" ] || [ "$DB2_TRUST_VAL" != "yes" ]; then
            echo "::error::Production deploy currently requires DB2_ENCRYPT=no and DB2_TRUST_SERVER_CERT=yes until SQL Server TLS is remediated"
            exit 1
          fi

          # --- Override map: variables with production-specific logic ---
          declare -A OVERRIDES=(
            [APP_ENV]="production"
            [WRAP_API_BASE]="$EFFECTIVE_WRAP_API_BASE"
            [INTERNAL_API_URL]="$EFFECTIVE_INTERNAL_API_URL"
            [AUDIT_INTERNAL_API_BASE]="$EFFECTIVE_AUDIT_INTERNAL_API_BASE"
            [AUDFACT_API_PUBLIC_URL]="$API_PUBLIC_URL"
            [AUDFACT_FRONTEND_PUBLIC_URL]="$FRONTEND_PUBLIC_URL"
            [DB_HOST]="$EFFECTIVE_DB_HOST"
            [DB2_HOST]="$EFFECTIVE_DB2_HOST"
            [ALLOWED_ORIGINS]="$EFFECTIVE_ALLOWED_ORIGINS"
            [WEBHOOK_URL]="$EFFECTIVE_WEBHOOK_URL"
            [CAPABILITIES_URL]="$EFFECTIVE_CAPABILITIES_URL"
            [AUDIT_RESPONSE_IA_ENABLED]="$(echo "$ALL_VARS" | jq -r '.AUDIT_RESPONSE_IA_ENABLED // "0"')"
            [LOG_LEVEL]="$(echo "$ALL_VARS" | jq -r '.LOG_LEVEL // "warning"')"
          )

          # --- Secret keys: extract from ALL_SECRETS instead of ALL_VARS ---
          SECRET_KEYS="DB_USER DB_PASS DB2_USER DB2_PASS GEMINI_API_KEY GOOGLE_DRIVE_PRIVATE_KEY MCP_WEBHOOK_SECRET REDIS_PASSWORD"

          # --- Infrastructure variables (resolved from workflow env, not .env.example) ---
          INFRA_SKIP="AUDFACT_PHP_IMAGE AUDFACT_NGINX_IMAGE AUDFACT_FRONTEND_IMAGE AUDFACT_DOCS_IMAGE AUDFACT_IMAGE_TAG AUDFACT_FRONTEND_HOST_PORT"

          # --- Generate .env ---
          {
            # Infrastructure block (from workflow global env)
            write_env_var 'AUDFACT_PHP_IMAGE' "$PHP_IMAGE"
            write_env_var 'AUDFACT_NGINX_IMAGE' "$NGINX_IMAGE"
            write_env_var 'AUDFACT_FRONTEND_IMAGE' "$FRONTEND_IMAGE"
            write_env_var 'AUDFACT_DOCS_IMAGE' "$DOCS_IMAGE"
            write_env_var 'AUDFACT_IMAGE_TAG' "$IMAGE_TAG"
            write_env_var 'AUDFACT_FRONTEND_HOST_PORT' "$FRONTEND_HOST_PORT"
            printf '\n'

            # Dynamic block: iterate .env.example as source of truth
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"

              # Preserve blank lines as visual separators
              if [ -z "${line//[[:space:]]/}" ]; then
                printf '\n'
                continue
              fi

              # Skip comments
              [[ "$line" =~ ^[[:space:]]*# ]] && continue

              # Parse KEY=DEFAULT
              if [[ "$line" =~ ^[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*=(.*)$ ]]; then
                key="${BASH_REMATCH[1]}"
                default="${BASH_REMATCH[2]}"

                # Skip infrastructure variables (already written above)
                if echo " $INFRA_SKIP " | grep -qw "$key"; then
                  continue
                fi

                # Priority 1: Override map (production-specific logic)
                if [ -n "${OVERRIDES[$key]+isset}" ]; then
                  write_env_var "$key" "${OVERRIDES[$key]}"
                # Priority 2: Secret (from ALL_SECRETS)
                elif echo " $SECRET_KEYS " | grep -qw "$key"; then
                  val="$(echo "$ALL_SECRETS" | jq -r --arg k "$key" '.[$k] // empty')"
                  write_env_var "$key" "${val:-$default}"
                # Priority 3: Variable (from ALL_VARS, fallback to .env.example default)
                else
                  val="$(echo "$ALL_VARS" | jq -r --arg k "$key" '.[$k] // empty')"
                  write_env_var "$key" "${val:-$default}"
                fi
              fi
            done < .env.example

          } > "$DEPLOY_PATH/.env"

          chmod 600 "$DEPLOY_PATH/.env"

          # --- Post-generation validation: fail-fast on missing required values ---
          REQUIRED_KEYS="DB_USER DB_PASS DB2_USER DB2_PASS GEMINI_API_KEY MCP_WEBHOOK_SECRET DB_HOST DB_PORT DB_NAME DB2_HOST DB2_PORT DB2_NAME"
          MISSING=""
          for rk in $REQUIRED_KEYS; do
            val="$(grep "^${rk}=" "$DEPLOY_PATH/.env" | head -1 | cut -d= -f2-)"
            if [ -z "$val" ]; then
              MISSING="$MISSING $rk"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Required production variables are empty in generated .env:$MISSING"
            exit 1
          fi

          # --- Production invariant checks ---
          GENERATED_APP_ENV="$(grep '^APP_ENV=' "$DEPLOY_PATH/.env" | head -1 | cut -d= -f2-)"
          if [ "$GENERATED_APP_ENV" != "production" ]; then
            echo "::error::APP_ENV must be 'production' in generated .env but got '$GENERATED_APP_ENV'"
            exit 1
          fi

          GENERATED_INTERNAL="$(grep '^INTERNAL_API_URL=' "$DEPLOY_PATH/.env" | head -1 | cut -d= -f2-)"
          if [ "$GENERATED_INTERNAL" != "http://nginx" ]; then
            echo "::error::INTERNAL_API_URL must be 'http://nginx' for Docker runtime but got '$GENERATED_INTERNAL'"
            exit 1
          fi

          echo "Production .env generated from .env.example ($(grep -c '=' "$DEPLOY_PATH/.env") variables)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull release images
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose pull

      - name: Preflight SQL connectivity
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"

          docker run --rm -i --env-file .env "${PHP_IMAGE}:${IMAGE_TAG}" php <<'PHP'
          <?php
          $connections = [
              ['default', 'DB_HOST', 'DB_PORT', 'DB_NAME', 'DB_USER', 'DB_PASS', 'DB_ENCRYPT', 'DB_TRUST_SERVER_CERT'],
              ['db2', 'DB2_HOST', 'DB2_PORT', 'DB2_NAME', 'DB2_USER', 'DB2_PASS', 'DB2_ENCRYPT', 'DB2_TRUST_SERVER_CERT'],
          ];

          $failed = false;
          foreach ($connections as $connection) {
              [$label, $hostKey, $portKey, $nameKey, $userKey, $passKey, $encryptKey, $trustKey] = $connection;

              $host = getenv($hostKey) ?: '';
              $port = getenv($portKey) ?: '1433';
              $database = getenv($nameKey) ?: '';
              $user = getenv($userKey) ?: '';
              $password = getenv($passKey) ?: '';
              $encrypt = getenv($encryptKey) ?: 'no';
              $trust = getenv($trustKey) ?: 'yes';

              $dsn = sprintf(
                  'sqlsrv:Server=%s,%s;Database=%s;Encrypt=%s;TrustServerCertificate=%s;ConnectionPooling=0;LoginTimeout=5',
                  $host,
                  $port,
                  $database,
                  $encrypt,
                  $trust
              );

              $start = microtime(true);
              try {
                  $pdo = new PDO($dsn, $user, $password, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
                  $pdo->query('SELECT 1')->fetchColumn();
                  $elapsedMs = (int) round((microtime(true) - $start) * 1000);
                  echo "SQL preflight {$label} OK ({$host}:{$port}, {$elapsedMs}ms)" . PHP_EOL;
              } catch (Throwable $e) {
                  $failed = true;
                  $elapsedMs = (int) round((microtime(true) - $start) * 1000);
                  echo "::error::SQL preflight {$label} failed ({$host}:{$port}, {$elapsedMs}ms): " . $e->getCode() . PHP_EOL;
              }
          }

          exit($failed ? 1 : 0);
          PHP

      - name: Start production stack
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose --profile frontend --profile docs up -d --no-build --remove-orphans

      - name: Health check
        run: |
          set -euo pipefail
          sleep 30
          cd "$DEPLOY_PATH"
          if docker exec audfact-frontend sh -lc "grep -R -E 'localhost:8080|127\\.0\\.0\\.1:8080' .next/static 2>/dev/null"; then
            echo "::error::Frontend bundle contains a local backend URL"
            exit 1
          fi

          for i in 1 2 3 4 5; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1 && curl -sf http://localhost:8080/docs/ > /dev/null 2>&1 && curl -sf "http://localhost:${FRONTEND_HOST_PORT:-3100}/api/health" > /dev/null 2>&1 && curl -sf "http://localhost:${FRONTEND_HOST_PORT:-3100}/api/backend/health" > /dev/null 2>&1 && curl -sf "http://localhost:${FRONTEND_HOST_PORT:-3100}/clients" > /dev/null 2>&1; then
              echo "Deploy successful. API and frontend health checks passed."
              exit 0
            fi
            echo "Attempt $i/5 failed, waiting 10s..."
            sleep 10
          done

          cd "$DEPLOY_PATH"
          echo "::error::Health check failed"
          docker ps --format "table {{.Names}}\t{{.Status}}"
          docker compose logs --tail=120 frontend php nginx worker-batch worker-orchestrator worker-extraction worker-downloader worker-normalizer worker-policy worker-persistence
          exit 1
