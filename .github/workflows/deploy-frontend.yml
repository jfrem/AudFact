name: Deploy Frontend — AudFact

on:
  push:
    branches: [main]
  workflow_dispatch:

# CICD-003: Principle of least privilege
permissions:
  contents: read

jobs:
  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15  # CICD-004

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "Missing required GitHub secret: NEXT_PUBLIC_API_URL"
            exit 1
          fi
          npm run build

  deploy-frontend:
    name: Deploy Frontend to Production
    needs: validate-frontend
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30  # CICD-004
    concurrency:
      group: deploy-production-frontend-main
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive

      - name: Validate required secrets
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "Missing required GitHub secret: NEXT_PUBLIC_API_URL"
            exit 1
          fi

      - name: Rebuild and restart frontend container
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          echo "Deploying frontend..."
          docker compose -f docker-compose.frontend.yml build
          docker compose -f docker-compose.frontend.yml up -d --force-recreate

      - name: Frontend health check
        run: |
          sleep 20
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend deploy successful"
              exit 0
            fi
            echo "Attempt $i/$RETRIES failed, waiting 10s..."
            sleep 10
          done
          echo "Frontend health check failed"
          docker ps --format "table {{.Names}}\t{{.Status}}"
          docker compose -f docker-compose.frontend.yml logs --tail=120 frontend
          exit 1

      # CICD-014: Zero-source purge for frontend
      - name: 🧹 Clean frontend source from host
        if: success()
        run: |
          echo "Cleaning frontend source from deployment host..."
          rm -rf "$GITHUB_WORKSPACE/frontend/src" "$GITHUB_WORKSPACE/frontend/node_modules" 2>/dev/null || true
          echo "Frontend source cleaned."
