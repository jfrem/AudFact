name: CI - AudFact

on:
  push:
    branches: [main, develop, "feature/*", "Dev", "staging"]
  pull_request:
    branches: [main, develop, "staging"]

permissions:
  contents: read

jobs:
  lint:
    name: PHP Lint & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlsrv
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP Syntax Check
        run: |
          echo "Checking PHP syntax..."
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -P4 php -l
          echo "All PHP files passed syntax check"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check project structure
        run: |
          echo "Validating project structure..."
          for dir in app/Controllers app/Models app/Services core public; do
            if [ ! -d "$dir" ]; then
              echo "Missing directory: $dir"
              exit 1
            fi
          done
          echo "Project structure is valid"

      - name: Validate worker services in docker-compose
        run: |
          echo "Validating worker services consistency..."

          if [ -f docker-compose.prod.yml ]; then
            echo "::error::docker-compose.prod.yml is not allowed. docker-compose.yml is the single runtime source of truth."
            exit 1
          fi

          REGISTERED=$(grep -oP "^    '\K[a-z_]+(?='\s*=>\s*\[)" bin/audit-worker.php)
          COMPOSE_SERVICES=$(grep -oP '^\s+worker-\K\w+(?=:)' docker-compose.yml | sort -u)

          MISSING=""
          for worker in $REGISTERED; do
            if ! echo "$COMPOSE_SERVICES" | grep -qw "$worker"; then
              MISSING="$MISSING $worker"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::Workers registrados en bin/audit-worker.php sin servicio en docker-compose.yml:$MISSING"
            exit 1
          fi

          EXTRA=""
          for worker in $COMPOSE_SERVICES; do
            if ! echo "$REGISTERED" | grep -qw "$worker"; then
              EXTRA="$EXTRA $worker"
            fi
          done

          if [ -n "$EXTRA" ]; then
            echo "::error::worker-* services in docker-compose.yml without registry entry in bin/audit-worker.php:$EXTRA"
            exit 1
          fi

          echo "Worker registry and docker-compose services match"

      - name: Check for secrets in code
        run: |
          echo "Scanning for hardcoded secrets..."
          ISSUES=$(grep -rn --include="*.php" -E "(password|secret|api_key)\s*=\s*['\"][^'\"]+['\"]" --exclude-dir=vendor . || true)
          if [ -n "$ISSUES" ]; then
            echo "::error::Hardcoded secrets detected in source files"
            echo "$ISSUES"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Run PHPUnit Tests
        run: |
          echo "Running unit tests..."
          vendor/bin/phpunit --configuration phpunit.xml --testdox --colors=always
          echo "All tests passed"
