services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ENABLE_XDEBUG: "0"
        WWWUSER_ID: ${WWWUSER_ID:-33}
        WWWGROUP_ID: ${WWWGROUP_ID:-33}
    # container_name has been REMOVED to allow replica scaling
    env_file:
      - .env
    # El código fuente se integra en la fase de build (Dockerfile).
    # Ya NO vinculamos ./:/var/www/html para mantener el entorno de producción inmutable y limpio.
    volumes:
      - ./logs:/var/www/html/logs
    expose:
      - "9000"
    deploy:
      replicas: 5
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      # Verificación real: carga app PHP + SELECT 1 contra SQL Server
      test: ["CMD", "php", "/usr/local/bin/audfact-healthcheck.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: audfact-redis
    volumes:
      - redis_data:/data
    # CICD-007: Redis authentication required
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru --save 60 1000 --requirepass ${REDIS_PASSWORD:-audfact_dev_default}
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 300M

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: audfact-nginx
    depends_on:
      - php
      - redis
    ports:
      - "8080:80"
    environment:
      # Solo sustituir variables que empiecen con AUDIT_
      NGINX_ENVSUBST_FILTER: "AUDIT_"
      AUDIT_NGINX_READ_TIMEOUT: ${AUDIT_NGINX_READ_TIMEOUT:-3600}

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ENABLE_XDEBUG: "0"
        WWWUSER_ID: ${WWWUSER_ID:-33}
        WWWGROUP_ID: ${WWWGROUP_ID:-33}
    container_name: audfact-worker
    env_file:
      - .env
    volumes:
      - ./logs:/var/www/html/logs
    depends_on:
      - redis
      - php
    command: php bin/audit-worker.php --poll-timeout=5
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.8'

volumes:
  redis_data:
