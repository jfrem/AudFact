services:
  # ── Frontend (Next.js) ──
  # Solo se levanta con: docker compose --profile frontend up
  # En local se usa `npm run dev` directamente.
  frontend:
    image: ${AUDFACT_FRONTEND_IMAGE:-ghcr.io/jfrem/audfact-frontend}:${AUDFACT_IMAGE_TAG:-latest}
    container_name: audfact-frontend
    profiles:
      - frontend
    depends_on:
      - nginx
    ports:
      - "${AUDFACT_FRONTEND_HOST_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      INTERNAL_API_URL: http://nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── PHP-FPM ──
  php:
    image: ${AUDFACT_PHP_IMAGE:-ghcr.io/jfrem/audfact-php}:${AUDFACT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ENABLE_XDEBUG: "0"
        WWWUSER_ID: ${WWWUSER_ID:-33}
        WWWGROUP_ID: ${WWWGROUP_ID:-33}
    # container_name removed to allow replica scaling
    env_file:
      - .env
    volumes:
      - ./logs:/var/www/html/logs
      - ./responseIA:/var/www/html/responseIA
    expose:
      - "9000"
    restart: unless-stopped
    deploy:
      replicas: 5
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/audfact-healthcheck.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: audfact-redis
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-4gb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --maxmemory "$${REDIS_MAXMEMORY:-4gb}" --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY:-volatile-lru}" --save 60 1000 --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --maxmemory "$${REDIS_MAXMEMORY:-4gb}" --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY:-volatile-lru}" --save 60 1000
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${REDIS_CONTAINER_MEMORY:-5G}

  # ── Nginx ──
  nginx:
    image: ${AUDFACT_NGINX_IMAGE:-ghcr.io/jfrem/audfact-nginx}:${AUDFACT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: audfact-nginx
    depends_on:
      - php
      - redis
    ports:
      - "8080:80"
    environment:
      NGINX_ENVSUBST_FILTER: "AUDIT_"
      AUDIT_NGINX_READ_TIMEOUT: ${AUDIT_NGINX_READ_TIMEOUT:-3600}
    restart: unless-stopped

  # ── Pipeline Event-Driven Workers ──
  # Cada worker consume un stream/tipo de evento específico.
  # En local: docker compose up --build
  # En producción: docker compose up --no-build --profile frontend

  worker-orchestrator:
    image: ${AUDFACT_PHP_IMAGE:-ghcr.io/jfrem/audfact-php}:${AUDFACT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ENABLE_XDEBUG: "0"
        WWWUSER_ID: ${WWWUSER_ID:-33}
        WWWGROUP_ID: ${WWWGROUP_ID:-33}
    env_file:
      - .env
    volumes:
      - ./logs:/var/www/html/logs
    depends_on:
      - redis
      - nginx
    command: php bin/audit-worker.php orchestrator
    restart: on-failure
    deploy:
      replicas: ${AUDIT_WORKER_ORCHESTRATOR_REPLICAS:-3}
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  worker-batch:
    image: ${AUDFACT_PHP_IMAGE:-ghcr.io/jfrem/audfact-php}:${AUDFACT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ENABLE_XDEBUG: "0"
        WWWUSER_ID: ${WWWUSER_ID:-33}
        WWWGROUP_ID: ${WWWGROUP_ID:-33}
    env_file:
      - .env
    volumes:
      - ./logs:/var/www/html/logs
    depends_on:
      - redis
      - nginx
    command: php bin/audit-worker.php batch
    restart: on-failure
    deploy:
      replicas: ${AUDIT_WORKER_BATCH_REPLICAS:-2}
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  worker-extraction:
    image: ${AUDFACT_PHP_IMAGE:-ghcr.io/jfrem/audfact-php}:${AUDFACT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ENABLE_XDEBUG: "0"
        WWWUSER_ID: ${WWWUSER_ID:-33}
        WWWGROUP_ID: ${WWWGROUP_ID:-33}
    env_file:
      - .env
    volumes:
      - ./logs:/var/www/html/logs
      - ./responseIA:/var/www/html/responseIA
    depends_on:
      - redis
      - nginx
    command: php bin/audit-worker.php extraction
    restart: on-failure
    deploy:
      replicas: ${AUDIT_WORKER_EXTRACTION_REPLICAS:-8}
      resources:
        limits:
          memory: 1G
          cpus: '0.8'

  worker-downloader:
    image: ${AUDFACT_PHP_IMAGE:-ghcr.io/jfrem/audfact-php}:${AUDFACT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ENABLE_XDEBUG: "0"
        WWWUSER_ID: ${WWWUSER_ID:-33}
        WWWGROUP_ID: ${WWWGROUP_ID:-33}
    env_file:
      - .env
    volumes:
      - ./logs:/var/www/html/logs
    depends_on:
      - redis
      - nginx
    command: php bin/audit-worker.php downloader
    restart: on-failure
    deploy:
      replicas: ${AUDIT_WORKER_DOWNLOADER_REPLICAS:-8}
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  worker-normalizer:
    image: ${AUDFACT_PHP_IMAGE:-ghcr.io/jfrem/audfact-php}:${AUDFACT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ENABLE_XDEBUG: "0"
        WWWUSER_ID: ${WWWUSER_ID:-33}
        WWWGROUP_ID: ${WWWGROUP_ID:-33}
    env_file:
      - .env
    volumes:
      - ./logs:/var/www/html/logs
    depends_on:
      - redis
    command: php bin/audit-worker.php normalizer
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  worker-policy:
    image: ${AUDFACT_PHP_IMAGE:-ghcr.io/jfrem/audfact-php}:${AUDFACT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ENABLE_XDEBUG: "0"
        WWWUSER_ID: ${WWWUSER_ID:-33}
        WWWGROUP_ID: ${WWWGROUP_ID:-33}
    env_file:
      - .env
    volumes:
      - ./logs:/var/www/html/logs
      - ./responseIA:/var/www/html/responseIA
    depends_on:
      - redis
    command: php bin/audit-worker.php policy
    restart: on-failure
    deploy:
      replicas: ${AUDIT_WORKER_POLICY_REPLICAS:-2}
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  worker-aggregator:
    image: ${AUDFACT_PHP_IMAGE:-ghcr.io/jfrem/audfact-php}:${AUDFACT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ENABLE_XDEBUG: "0"
        WWWUSER_ID: ${WWWUSER_ID:-33}
        WWWGROUP_ID: ${WWWGROUP_ID:-33}
    env_file:
      - .env
    volumes:
      - ./logs:/var/www/html/logs
    depends_on:
      - redis
    command: php bin/audit-worker.php aggregator
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  redis_data:
