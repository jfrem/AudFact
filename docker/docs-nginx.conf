server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El proxy principal (nginx-ha) envía las peticiones con ruta /docs/*.
    # Docusaurus genera los archivos en la raíz del build (no dentro de /docs/).
    # Usamos alias para mapear /docs/ → root del build.
    location /docs/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Redirigir la raíz al prefijo correcto
    location = / {
        return 301 /docs/;
    }
}
